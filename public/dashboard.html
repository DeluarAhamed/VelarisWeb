<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard | Velaris</title>
<link rel="icon" type="image/png" sizes="32x32" href="/velaris-design-system/assets/favicon-32.png">
<link rel="stylesheet" href="/velaris-design-system/colors_and_type.css?v=20261010-a1">
<link rel="stylesheet" href="/velaris-design-system/admin/admin.css?v=20261010-a2">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="/velaris-design-system/assets/velaris-icon.webp" alt=""><span>Velaris<small>Owner dashboard</small></span></div>
    <nav class="nav" aria-label="Dashboard">
      <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</a>
      <a href="#leads" data-view="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/></svg>Leads<span class="count" id="newCount" hidden></span></a>
      <a href="#analytics" data-view="analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</a>
      <a href="#content" data-view="content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Content</a>
      <a href="#setup" data-view="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Setup</a>
    </nav>
    <div class="spacer"></div>
    <hr>
    <nav class="nav">
      <a href="/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>View website</a>
      <a href="#" id="signOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <button class="btn btn-ghost menu-btn" id="menuBtn" aria-label="Open menu">&#9776;</button>
        <div><h1 id="viewTitle">Overview</h1><p id="viewSub">Leads, pipeline and website insights</p></div>
      </div>
      <div class="top-actions">
        <small id="updated"></small>
        <button class="btn btn-ghost" id="refresh" type="button">Refresh</button>
        <div class="range" id="range" role="group" aria-label="Date range">
          <button data-days="7">7d</button><button data-days="30" class="on">30d</button><button data-days="90">90d</button>
        </div>
      </div>
    </div>
    <div id="banner"></div>
    <div id="view" aria-live="polite"><div class="empty">Loading&hellip;</div></div>
  </main>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-bg" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="Lead details" id="drawerPanel"></aside>
</div>

<script src="/velaris-design-system/admin/admin.js?v=20261010-a2"></script>
</body>
</html>
