<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | Velaris Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="/velaris-design-system/assets/favicon-32.png">
<link rel="stylesheet" href="/velaris-design-system/colors_and_type.css?v=20261010-a1">
<link rel="stylesheet" href="/velaris-design-system/admin/admin.css?v=20261011-a4">
</head>
<body>
<main class="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand"><img src="/velaris-design-system/assets/velaris-icon.webp" alt="">Velaris</div>
    <h1>Owner dashboard</h1>
    <p>Sign in to see your leads, pipeline and website traffic.</p>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</main>
<script src="/velaris-design-system/admin/login.js?v=20261011-a4"></script>
</body>
</html>
